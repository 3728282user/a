:root{--bg:#1a1b1e;--panel:#2b2d33;--line:#4d5058;--tx:#f4f3ee;--mut:#9ea1aa;--gold:#d6b04a;--gold2:#ecd488;--fire:#e0603f;--water:#4aa3e8;--plant:#6fbf6a;--ice:#8fd8e8;--storm:#c7b8f0;--shadow:#a58bd0;--light:#ecd488;--metal:#b4bcc9;--wind:#8fd6b4;--ground:#b98b55;--white:#d9dbe0;--r-common:#9ea1aa;--r-rare:#4aa3e8;--r-epic:#a58bd0;--r-legendary:#d6b04a;--r-special:#e8719a;--cw:min(124px,calc((100vw - 96px)/6.5));--g:8px}
*{box-sizing:border-box}html,body{background:#1a1b1e}
body{margin:0;color:var(--tx);font:15px system-ui,sans-serif;min-height:100vh}
.nf{font-family:NFSub,'Symbols Nerd Font','JetBrainsMono Nerd Font','FiraCode Nerd Font',monospace;font-style:normal;font-weight:400}
button{font:inherit;color:var(--tx);background:#363940;border:1px solid #565a63;border-radius:6px;padding:8px 14px;cursor:pointer}
button:hover{background:#40444c}button:active:not(:disabled){background:#2f3238}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--gold);color:#1b1608;border-color:var(--gold);font-weight:700}button.pri:hover{background:#e0bc57}
.mut{color:var(--mut)}.wrap{max-width:1000px;margin:0 auto;padding:12px}h1{color:var(--gold2)}
.arena{background:#222428;border:1px solid #50535b;border-radius:14px;padding:10px}
.card,.slot{width:var(--cw);height:calc(var(--cw)*1.5);padding:0}
.card{position:relative;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;border-radius:8px;border:2px solid var(--c);font-size:10px;user-select:none;background:var(--panel);}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:3px;padding:3px 4px;background:#0003}
.card .nm{font-weight:700;font-size:10px;line-height:1.05;overflow:hidden}
.card .cs{background:var(--gold);color:#1b1608;border-radius:9px;min-width:18px;padding:0 5px;font-size:11px;font-weight:800;flex:none;line-height:16px;text-align:center;display:block}
.art{position:relative;height:28%;margin:0 4px;border-radius:5px;display:grid;place-items:center;overflow:hidden;background:#1b1c20;flex:none}
.art>.nf{font-size:calc(var(--cw)*.22);color:var(--c)}
.art em{position:absolute;top:2px;right:3px;font-size:12px;color:#e8f4ff}.art em.w{right:auto;left:3px;color:var(--gold2)}
.tb{display:flex;justify-content:space-between;align-items:center;margin:3px 4px 0;padding:0 5px;font-size:7.5px;font-weight:800;letter-spacing:.06em;border-radius:3px;background:var(--c);color:#121214;flex:none}
.card .ab{flex:1;margin:3px 4px;padding:3px 4px;background:#1b1c20;border-radius:4px;font-size:9px;line-height:1.15;color:#e2e1dc;overflow:hidden}.card .ab.sm{font-size:7.5px}
.card .st{display:flex;flex-direction:column;margin:0 4px 4px;padding:2px 5px;background:#1b1c20;border-radius:4px;font-size:12px;font-weight:800;line-height:1.2;flex:none}
.k-s{background:#38341f;border-color:var(--gold)}.k-s .art{background:#241f10}
.k-t{background:#303238;border-color:#d3d6dc}.k-t .art{background:#232428}
.card.sp{border-color:var(--gold2);outline:2px solid var(--gold);outline-offset:1px}.card.sp .tb{background:var(--gold2)}.card.sp .nm{color:var(--gold2)}
.card.mini .ab{display:none}.card.mini .art{height:auto;flex:1;margin:2px 4px}.card.mini .art>.nf{font-size:calc(var(--cw)*.68)}.card.mini .st{margin-top:2px}
.sel{outline:3px solid #fff}.card.ok:not(.sel){outline:2px solid var(--gold);outline-offset:1px}.kn{position:absolute;top:24px;left:6px;font-size:10px;font-weight:700;color:var(--mut);z-index:3}.warn{color:var(--fire);font-weight:700}.card .hd{border-top:4px solid var(--rc,#9ea1aa)}.hz{outline:3px dashed var(--gold)!important;outline-offset:2px}#big{position:fixed;right:12px;top:12px;z-index:79;display:none;pointer-events:none}@media(max-width:1250px){#big{display:none!important}}.gm{display:none;flex:1;align-self:center;color:#ffd24a;font-weight:700}body.nolog .gm{display:block}body.nolog .log{display:none}:root[data-size=small]{--cw:min(104px,calc((100vw - 96px)/6.5))}:root[data-size=large]{--cw:min(144px,calc((min(100vw,1000px) - 96px)/6.5))}.ia{color:#f0a23a}.ih{color:#e5546b}.tgt{outline:3px dashed var(--gold)}.rdy{outline:2px solid #fff;outline-offset:1px}.frz{opacity:.6}.dim{opacity:.5}.tgtf{outline:2px solid var(--gold);border-radius:8px}
.bn{position:absolute;top:2px;right:4px;z-index:5}
.slot{border:2px dashed #555962;border-radius:8px;background:#1d1e22}
.slot.ts{display:grid;place-items:center;color:#6c6f79;font-size:11px;font-weight:700;letter-spacing:.12em}
.slot.trapback{display:grid;place-content:center;gap:4px;text-align:center;background:#34373e;border:2px solid var(--gold);color:var(--gold2);font-weight:800;letter-spacing:.12em;font-size:11px}.slot.trapback .nf{font-size:calc(var(--cw)*.3)}
.row{display:flex;gap:var(--g);justify-content:center;min-height:calc(var(--cw)*1.5);flex-wrap:nowrap}.lane{display:flex;gap:var(--g);justify-content:center;flex-wrap:nowrap}
.side{display:grid;gap:var(--g);margin:var(--g) 0}.side.pl{grid-template-columns:calc(var(--cw)*.5) 1fr var(--cw);grid-template-areas:"core c p";align-items:end}.side.fo{grid-template-columns:var(--cw) 1fr calc(var(--cw)*.5);grid-template-areas:"p c core";align-items:start}
.a-c{grid-area:c;display:flex;flex-direction:column;gap:var(--g);align-items:center}.a-p{grid-area:p}.a-core{grid-area:core}
.piles{display:flex;flex-direction:column;gap:calc(var(--g) + 10px);align-items:center}
.pile{width:var(--cw);height:calc(var(--cw)*1.5);position:relative}.pile.gy{cursor:pointer}
.stk{position:relative;width:100%;height:100%}
.ly{position:absolute;inset:0;border-radius:8px;border:1px solid #0009}.ly.a{background:#d7d8dc}.ly.b{background:#6c6f78}
.top{position:absolute;inset:0;border-radius:8px;border:2px solid var(--gold);background:var(--pl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--gold2)}
.top .pi{font-size:calc(var(--cw)*.26)}.top b{font-size:18px;color:#fff}
.pile.dk{--pl:#3b3e46}.pile.gy{--pl:#2a2b30}.pile.gy .top{border-color:#b9bcc4;color:#d9dbe0}
.corez{width:calc(var(--cw)*.5);height:calc(var(--cw)*1.5);border:2px solid var(--gold);border-radius:10px;background:#2b2d33;padding:4px 2px;text-align:center;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.corez .ch{font-size:9px;font-weight:700;color:var(--gold2)}.corez .sub{font-size:9px;color:#d7d6d0;line-height:1.1}.corez small{font-size:7px;color:var(--mut);line-height:1.05}
.orb{width:calc(var(--cw)*.42);height:calc(var(--cw)*.42);border-radius:50%;display:grid;place-items:center;background:var(--gold)}.orb .big{color:#1b1608;font-size:20px;font-weight:800}
.pbar{display:flex;align-items:center;gap:10px;padding:4px 8px;margin:6px 0;position:relative;flex-wrap:wrap}
.hp{flex:1;min-width:130px;height:20px;background:#15161a;border-radius:10px;position:relative;overflow:hidden;border:1px solid #565a63}.hp i{position:absolute;inset:0 auto 0 0;background:#b08d2f;transition:width .5s}.hp span{position:relative;font-size:12px;font-weight:700;padding-left:8px;line-height:18px;color:#fff}
.en{background:var(--gold);color:#1b1608;border-radius:12px;padding:2px 10px;font-weight:800}
.mid{display:flex;gap:10px;margin:8px 0}.log{flex:1;background:#141518;border-radius:6px;padding:8px;height:100px;overflow:auto;font-size:13px;color:var(--mut);border:1px solid #33353b}.ctl{display:flex;flex-direction:column;gap:6px}
.hand{padding-top:16px}.row.hand{flex-wrap:nowrap;--cw:calc((min(100vw,1000px) - 24px - 7*var(--g))/8)}.row.hand .card .nm{font-size:min(10px,calc(var(--cw)*.085))}.row.hand .card .st{font-size:min(12px,calc(var(--cw)*.1))}.hand .card:hover{transform:translateY(-14px);z-index:10}
.ohand{display:flex;justify-content:center;height:84px;padding-top:4px}.sleeve{width:58px;height:82px;border-radius:6px;border:2px solid var(--gold);background:#3b3e46;position:relative;margin-left:-24px;display:grid;place-items:center;transform-origin:50% 130%}.sleeve:first-child{margin-left:0}
.sleeve::before{content:'';position:absolute;inset:4px;border:1px solid #d6b04a88;border-radius:4px}.sleeve .nf{color:var(--gold2);font-size:20px;position:relative}
.new{animation:pop .3s}.atk{z-index:30}.hit{animation:shake .3s .22s}.die{animation:die .45s .25s forwards}.ghost{pointer-events:none}
@keyframes pop{0%{transform:scale(.2) translateY(-30px);opacity:0}70%{transform:scale(1.12)}}
@keyframes shake{30%{transform:translateX(-7px) rotate(-3deg)}60%{transform:translateX(7px) rotate(3deg)}}@keyframes die{to{opacity:0;transform:scale(.5) rotate(12deg)}}
.fl{position:absolute;left:50%;top:25%;transform:translateX(-50%);font-weight:800;font-size:34px;paint-order:stroke;-webkit-text-stroke:3px #000;color:#ff6b5a;animation:fl .8s .22s both;pointer-events:none;z-index:6;white-space:nowrap}.fl.hl{color:#9dffb0}@keyframes fl{0%{opacity:0}15%{opacity:1}100%{top:-30%;opacity:0}}.pbar .fl{left:70%;top:0}
.sleeve.drawn{animation:drawE .5s ease-out both}@keyframes drawE{0%{transform:translate(-45vw,-6vh) rotate(-20deg) scale(.4);opacity:0}100%{opacity:1}}
.ban{position:fixed;inset:40% 0 auto;text-align:center;font-size:34px;font-weight:800;pointer-events:none;animation:ban .8s forwards;z-index:8;color:var(--gold2);}@keyframes ban{0%{opacity:0;transform:scale(.6)}20%,70%{opacity:1;transform:none}100%{opacity:0}}
.impact{position:fixed;width:0;height:0;z-index:70;pointer-events:none}.impact b{position:absolute;left:-48px;top:-3px;width:96px;height:6px;border-radius:3px;background:var(--ic);animation:slash .35s ease-out forwards}.impact b:nth-child(1){--r:45deg}.impact b:nth-child(2){--r:-45deg}.impact i{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border:4px solid var(--ic);border-radius:50%;animation:ring .45s ease-out forwards}
@keyframes slash{0%{transform:rotate(var(--r)) scaleX(0);opacity:1}60%{opacity:1}100%{transform:rotate(var(--r)) scaleX(1.1);opacity:0}}@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(5);opacity:0}}
.ghostdrag{position:fixed!important;z-index:60;pointer-events:none;opacity:.92;transform:rotate(4deg) scale(1.06)}.dz{outline:3px dashed #fff!important;outline-offset:2px}body.dragging{cursor:grabbing;user-select:none}.hand .card{touch-action:none}.row .card{touch-action:none}
